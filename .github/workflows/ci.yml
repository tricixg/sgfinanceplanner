name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test
        env:
          TZ: Asia/Singapore

      - run: npm run build
        env:
          # Placeholders so `next build` can run without real Supabase secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # SQL functions and migrations against a real Postgres (separate connections),
  # so the ledger concurrency/idempotency tests run too. The `webapp` job above
  # already checks migration naming/ordering and that 069+ re-run cleanly (PGlite).
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      - run: npx vitest run supabase/tests
        env:
          TZ: Asia/Singapore
          # Throwaway CI database; the harness creates and drops its own databases.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
